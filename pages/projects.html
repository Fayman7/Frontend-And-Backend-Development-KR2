<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Личное портфолио — Проекты</title>
        <link rel="stylesheet" href="../styles/styles.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    </head>
    <body class="d-flex flex-column min-vh-100">
        
<!-- ХЕДЕР -->
        <header class="bg-dark text-white py-3">
            <div class="container text-center">
                <h1 class="h4 mb-0">Мерзликин Иван</h1>
            </div>
        </header>

        <button class="theme-toggle" id="themeToggle" title="Сменить тему">
            <i class="bi bi-moon-stars-fill"></i>
        </button>

<!-- НАВИГАЦИЯ -->
        <nav class="bg-secondary text-white py-2">
            <div class="container">
                <div class="d-flex justify-content-center gap-4 flex-wrap">
                    <a href="../index.html" class="text-white text-decoration-none">Главная</a>
                    <a href="../pages/projects.html" class="text-white text-decoration-none">Проекты</a>
                    <a href="../pages/diary.html" class="text-white text-decoration-none">Дневник</a>
                    <a href="../pages/contacts.html" class="text-white text-decoration-none">Контакты</a>
                </div>
            </div>
        </nav>

<!-- СОДЕРЖИМОЕ СТРАНИЦЫ -->
        <main class="container my-5">
            <h2>Мои проекты</h2>
            <div class="btn-group mb-4" role="group">
                <button type="button" class="btn btn-primary active" data-filter="all">Все</button>
                <button type="button" class="btn btn-outline-primary" data-filter="html">HTML</button>
                <button type="button" class="btn btn-outline-primary" data-filter="js">JS</button>
                <button type="button" class="btn btn-outline-primary" data-filter="csharp">C#</button>
            </div>
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="project-grid">
                <div class="col" data-tech="html">
                    <div class="card h-100">
                        <img src="../images/picture.png" class="card-img-top" alt="Личный сайт">
                        <div class="card-body">
                            <h5 class="card-title">Личный сайт</h5>
                            <p class="card-text">HTML, CSS</p>
                            <button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#projectModal" data-title="Личный сайт" data-desc="Полноценный статический сайт с адаптивной версткой.">Подробнее</button>
                        </div>
                    </div>
                </div>
                <div class="col" data-tech="js">
                    <div class="card h-100">
                        <img src="../images/picture.png" class="card-img-top" alt="Todo">
                        <div class="card-body">
                            <h5 class="card-title">Todo-приложение</h5>
                            <p class="card-text">JavaScript</p>
                            <button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#projectModal" data-title="Todo-приложение" data-desc="Интерактивное приложение с localStorage.">Подробнее</button>
                        </div>
                    </div>
                </div>
                <div class="col" data-tech="csharp">
                    <div class="card h-100">
                        <img src="../images/picture.png" class="card-img-top" alt="Desktop App">
                        <div class="card-body">
                            <h5 class="card-title">Desktop-приложение</h5>
                            <p class="card-text">C#, WinForms</p>
                            <button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#projectModal"
                                    data-title="Desktop-приложение" data-desc="Калькулятор с GUI на C# и WinForms.">Подробнее</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

<!-- Модальное окно -->
        <div class="modal fade" id="projectModal" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Детали проекта</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <p id="modal-desc">Описание появится здесь</p>
                    </div>
                </div>
            </div>
        </div>

<!-- ФУТЕР -->
        <footer class="bg-dark text-white mt-auto">
            <div class="container py-3 text-center">
                <p class="mb-0">© 2025 Мерзликин Иван Андреевич.</p>
            </div>
        </footer>

<!-- JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="../scripts/filters.js"></script>
        <script src="../scripts/modal.js"></script>
        <script src="../scripts/theme.js"></script>

    </body>
</html>
