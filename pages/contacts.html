<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Семестровая работа</title>

        <link rel="stylesheet" href="style/styles.css">
        <link rel="icon" href="assets/logo.ico" type="image/x-icon">
        <script scr="main.js" defer></script>
    </head>

    <body>
        <div class="page-container">

            <header class="header">
                <h1>[Логотип]</h1>
                <p>Имя Студента</p>
            </header>

            <nav class="nav">
                <ul class="nav__list">
                    <li class="nav__item"><a class="nav__link" href="index.html">[Главная]</a></li>
                    <li class="nav__item"><a class="nav__link" href="pages/projects.html">[Проекты]</a></li>
                    <li class="nav__item"><a class="nav__link" href="pages/diary.html">[Дневник]</a></li>
                    <li class="nav__item"><a class="nav__link" href="pages/contacts.html">[Контакты]</a></li>
                </ul>
            </nav>

            <main class="content">
                <section class="contact-section">
                    <h2 class="section-title">Свяжитесь со мной</h2>
                    <form class="contact-form" id="contactForm">
                        <div class="form-group">
                            <input type="text" id="name" name="name" placeholder="Ваше имя" required>
                            <span class="error-message" id="nameError"></span>
                        </div>
                        <div class="form-group">
                            <input type="email" id="email" name="email" placeholder="Ваш email" required>
                            <span class="error-message" id="emailError"></span>
                        </div>
                        <div class="form-group">
                            <textarea id="message" name="message" placeholder="Ваше сообщение" rows="6" required></textarea>
                            <span class="error-message" id="messageError"></span>
                        </div>
                        
                        <button type="submit" class="form-submit">Отправить сообщение</button>
                    </form>
                </section>

                <section class="social-section">
                    <h2 class="section-title">Мои контакты</h2>
                    <div class="social-grid">
                        <a href="mailto:student@example.com" class="social-link email">
                            <i class="icon">📧</i>
                            <span>student@example.com</span>
                        </a>
                        <a href="https://github.com/student" class="social-link github" target="_blank">
                            <i class="icon">🐙</i>
                            <span>GitHub</span>
                        </a>
                        <a href="https://linkedin.com/in/student" class="social-link linkedin" target="_blank">
                            <i class="icon">💼</i>
                            <span>LinkedIn</span>
                        </a>
                        <a href="tel:+79991234567" class="social-link phone">
                            <i class="icon">📞</i>
                            <span>+7 (999) 123-45-67</span>
                        </a>
                    </div>
                </section>

                <section class="map-section">
                    <h2 class="section-title">Мое местоположение</h2>
                    <div class="map-container">
                        <img src="https://via.placeholder.com/800x400/667eea/white?text=📍+Москва,+Россия" 
                             alt="Карта местоположения" class="static-map">
                        <p class="map-info">Москва, Россия</p>
                    </div>
                </section>
            </main>

            <footer class="footer">
                <p>© 2024<a class="footer__link" href="pages/diary.html">Контакты</a></p>
            </footer>  

        </div>
    </body>
</html>
