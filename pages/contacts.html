<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Личное портфолио — Контакты</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" href="../styles/styles.css">
    </head>
    <body class="d-flex flex-column min-vh-100">

<!-- ХЕДЕР -->
        <header class="bg-dark text-white py-3">
            <div class="container text-center">
                <h1 class="h4 mb-0">Мерзликин Иван</h1>
            </div>
        </header>

        <button class="theme-toggle" id="themeToggle" title="Сменить тему">
            <i class="bi bi-moon-stars-fill"></i>
        </button>

<!-- НАВИГАЦИЯ -->
        <nav class="bg-secondary text-white py-2">
            <div class="container">
                <div class="d-flex justify-content-center gap-4 flex-wrap">
                    <a href="../index.html" class="text-white text-decoration-none">Главная</a>
                    <a href="../pages/projects.html" class="text-white text-decoration-none">Проекты</a>
                    <a href="../pages/diary.html" class="text-white text-decoration-none">Дневник</a>
                    <a href="../pages/contacts.html" class="text-white text-decoration-none">Контакты</a>
                </div>
            </div>
        </nav>

<!-- СОДЕРЖИМОЕ СТРАНИЦЫ -->
        <main class="container my-5 flex-grow-1">
            <h2 class="mb-4">Свяжитесь со мной</h2>
            <div class="row g-5">
                <div class="col-lg-7">
                    <div class="card h-100">
                        <div class="card-body">
                            <form id="contact-form">
                                <div class="mb-3">
                                    <label for="name" class="form-label">Имя</label>
                                    <input type="text" class="form-control" id="name" required>
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="email" required>
                                </div>
                                <div class="mb-3">
                                    <label for="message" class="form-label">Сообщение</label>
                                    <textarea class="form-control" id="message" rows="5" required></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Отправить сообщение</button>
                            </form>
                        </div>
                    </div>
                </div>
                <div class="col-lg-5">
                    <div class="card h-100">
                        <div class="card-body">
                            <h5 class="card-title">Контакты</h5>
                            <ul class="list-unstyled">
                                <li class="mb-3">
                                    <i class="bi bi-envelope-fill text-primary"></i>
                                    <span class="text-decoration-none ms-2">Почта</span>
                                </li>
                                <li class="mb-3">
                                    <i class="bi bi-github text-dark"></i>
                                    <a href="https://github.com/Fayman7" target="_blank" class="text-decoration-none ms-2">github.com</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </main>

<!-- ФУТЕР -->
        <footer class="bg-dark text-white mt-auto">
            <div class="container py-3 text-center">
                <p class="mb-0">© 2025 Мерзликин Иван Андреевич.</p>
            </div>
        </footer>

<!-- JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="../scripts/form-validation.js"></script>
        <script src="../scripts/theme.js"></script>
        
    </body>
</html>
